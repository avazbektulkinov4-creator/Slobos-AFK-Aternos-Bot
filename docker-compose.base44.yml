version: "3.9"

services:
  app:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5000"
    environment:
      - PORT=5000
      - BASE44_PREVIEW_MODE=1
    command: ["sh", "-c", "npm install --omit=dev && exec node index.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
